<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>岩戸開き</title>

<style>
body{
  font-family:sans-serif;
  max-width:800px;
  margin:auto;
  padding:20px;
}

input, textarea{
  width:100%;
  margin-bottom:10px;
}

.entry{
  border:1px solid #ccc;
  padding:10px;
  margin-top:10px;
}

.tags{
  color:#666;
}
</style>

</head>
<body>

<h1>神秘体験ログ</h1>

<p>体験日</p>
<input type="date" id="date">

<p>タイトル</p>
<input type="text" id="title">

<p>タグ（カンマ区切り）</p>
<input type="text" id="tags">

<p>内容</p>
<textarea id="content" rows="6"></textarea>

<button onclick="saveExperience()">保存</button>
<br><br>
  <button onclick="exportData()">
バックアップ(JSON)
</button>
<input
  type="file"
  id="importFile"
  accept=".json">

<button onclick="importData()">
復元(JSON)
</button>

  
<p>タグ検索</p>

<input
  type="text"
  id="searchTag"
  oninput="displayExperiences()">
<hr>

  
<h2>保存済み</h2>

<div id="savedData"></div>

<script>

function saveExperience() {

  const experience = {
    date: document.getElementById("date").value,
    title: document.getElementById("title").value,
    tags: document.getElementById("tags").value,
    content: document.getElementById("content").value
  };

  let experiences =
    JSON.parse(localStorage.getItem("experiences")) || [];

  experiences.push(experience);

  localStorage.setItem(
    "experiences",
    JSON.stringify(experiences)
  );

  displayExperiences();

  document.getElementById("title").value = "";
  document.getElementById("tags").value = "";
  document.getElementById("content").value = "";
}

function displayExperiences() {

  let experiences =
    JSON.parse(localStorage.getItem("experiences")) || [];

  let html = "";

const searchTag =
  document
  .getElementById("searchTag")
  .value
  .toLowerCase();

experiences
  .slice()
  .reverse()
  .forEach(exp => {

    if (
      searchTag &&
      !exp.tags
        .toLowerCase()
        .includes(searchTag)
    ) {
      return;
    }

      html += `
        <div class="entry">
          <strong>${exp.date}</strong><br>
          <strong>${exp.title}</strong><br>
          <div class="tags">
            ${exp.tags}
          </div>
          <p>${exp.content}</p>
        </div>
      `;

    });

  document.getElementById("savedData").innerHTML = html;
}

displayExperiences();
function exportData() {

  const experiences =
    JSON.parse(
      localStorage.getItem("experiences")
    ) || [];

  const dataStr =
    JSON.stringify(
      experiences,
      null,
      2
    );

  const blob =
    new Blob(
      [dataStr],
      { type: "application/json" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "mystical-experience-backup.json";

  a.click();

  URL.revokeObjectURL(url);
}

  function importData() {

  const file =
    document.getElementById(
      "importFile"
    ).files[0];

  if (!file) {

    alert(
      "JSONファイルを選択してください"
    );

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    try {

      const experiences =
        JSON.parse(
          e.target.result
        );

      localStorage.setItem(
        "experiences",
        JSON.stringify(experiences)
      );

      displayExperiences();

      alert("復元しました");

    } catch {

      alert(
        "JSONの読み込みに失敗しました"
      );

    }

  };

  reader.readAsText(file);
}
  
</script>

</body>
</html>
